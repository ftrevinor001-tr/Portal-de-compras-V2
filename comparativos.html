<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comparativos de compra</title>
<meta name="description" content="Comparativos de precios por clave entre proveedores, proveedor aprobado vigente e historial.">
<style>
/* Layout: barra superior con pestañas + área de trabajo amplia; tablas densas tipo hoja de cálculo para capturar precios. */
:root{
  /* Paleta del Portal de Compras V2 (navy SANVER) */
  --navy:#1e3a5f; --navy2:#1c4587;
  --bg:#f5f6fa; --surface:#ffffff; --surface-2:#f0f4ff; --line:#e2e6ed; --line-2:#c9d4f0;
  --fg:#1a2035; --muted:#6b7a99; --faint:#94a3b8;
  --accent:#1c4587; --accent-fg:#ffffff; --accent-soft:#e8eefc;
  --ok:#2e7d32; --ok-soft:#e6f2e8; --warn:#a16207; --warn-soft:#fdf3d8; --bad:#c0392b; --bad-soft:#fdeaea; --info-soft:#e8eefc; --info:#1c4587;
  --best:#e6f2e8;
  --f-display:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-body:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --f-mono:'Segoe UI',system-ui,sans-serif;
  --r:8px; --shadow:0 2px 10px rgba(30,58,95,.10);
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.005em;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.74rem;color:var(--muted);font-weight:600}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:0 16px;min-height:56px}
@media (max-width:900px){.top-in{flex-wrap:wrap;gap:4px 12px;padding-top:8px}.nav{order:3;flex-basis:100%}}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav button{background:none;border:0;padding:17px 11px 15px;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:3px solid transparent}
.nav button:hover{color:var(--fg)}
.nav button.on{color:var(--fg);border-bottom-color:var(--accent)}
.who{display:flex;align-items:center;gap:10px;font-size:.88rem;white-space:nowrap}
.who b{font-weight:600}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:.85rem;padding:6px 16px;border-bottom:1px solid var(--line)}

main{padding-inline:16px;padding-block:20px 60px;max-width:1500px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g2 > *, .g4 > *{min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h2,.panel > h3{margin-bottom:10px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:.86rem}
.kpi.attn .v{color:var(--warn)}

/* botones y campos */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=password],input[type=search],input[type=date],select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:7px 9px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

/* tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-family:var(--f-display);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--accent-soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.76rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.BORRADOR{background:var(--surface-2);color:var(--muted)}
.pill.EN.REVISION,.pill.rev{background:var(--warn-soft);color:var(--warn)}
.pill.APROBADO{background:var(--ok-soft);color:var(--ok)}
.pill.RECHAZADO,.pill.SUSPENDIDO{background:var(--bad-soft);color:var(--bad)}
.pill.ANULADO{background:var(--bad-soft);color:var(--bad)}
tr.anulada td{color:var(--faint)}
.pill.CANCELADO{background:var(--surface-2);color:var(--faint);text-decoration:line-through}
.pill.EVAL{background:var(--info-soft);color:var(--info)}
.up{color:var(--bad)} .down{color:var(--ok)}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* editor de comparativo */
.cmp-grid td,.cmp-grid th{padding:5px 7px}
.cmp-grid td input{padding:4px 6px;font-family:var(--f-mono);font-size:.88rem;text-align:right;width:84px}
.cmp-grid td input.clv{text-align:left;width:76px}
.cmp-grid td input.txt{font-family:var(--f-body);text-align:left;width:150px}
.cmp-grid td.desc{min-width:220px;max-width:300px;font-size:.86rem;line-height:1.25}
.cmp-grid td.best{background:var(--best)}
.cmp-grid .neto{display:block;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-align:right;margin-top:2px}
.cmp-grid th.prov{text-align:center;background:var(--accent-soft);color:var(--fg)}
.tbl-wrap.grid-scroll{overflow:auto;max-height:calc(100vh - 96px)}
.cmp-grid th{z-index:2}
.cmp-grid .fz{position:sticky;background:var(--surface);z-index:1}
.cmp-grid th.fz{z-index:4;background:var(--surface-2)}
.cmp-grid .fz-last{box-shadow:inset -2px 0 0 var(--line-2)}
.cmp-grid td.desc{min-width:200px;max-width:240px}
.cmp-grid select{padding:4px 6px;font-size:.86rem;width:170px}
th.num{font-family:var(--f-display);font-size:.8rem}
.vig{font-size:.8rem;line-height:1.2}
.vigtag{display:block;margin-top:3px;font-size:.74rem;color:var(--muted)}
.cmp-grid th.grp{border-left:2px solid var(--line-2);font-size:.82rem}
.cmp-grid th.sub{font-size:.7rem;padding:4px 6px;text-align:right}
.cmp-grid td.pc{border-left:2px solid var(--line-2)}
.cmp-grid td.pd{font-size:.82rem;background:var(--surface-2)}
.cmp-grid td.pf{font-family:var(--f-mono);font-size:.86rem}
.cmp-grid th.key{background:var(--accent);color:var(--accent-fg)}
.cmp-grid td.key{background:var(--accent-soft)}
.cmp-grid tfoot td{background:var(--surface-2);border-top:2px solid var(--line-2)}
.cmp-grid td.bloq{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.cmp-grid td.falta input{border-color:var(--warn)}
.tag-rel{font-family:var(--f-body);font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.tag-rel.comp{color:var(--ok)}
.tag-rel.sim{color:var(--info)}
.tag-lista{font-family:var(--f-body);font-size:.68rem;font-weight:600;color:var(--accent);white-space:nowrap}
.tag-lista.venc{color:var(--warn)}
.tag-bq{font-family:var(--f-body);font-size:.7rem;font-weight:600;color:var(--bad);text-transform:uppercase;letter-spacing:.03em}
.cmp-grid td.entrega{font-weight:600;font-size:.74rem;text-align:center;border-left:2px solid var(--line-2);color:var(--fg)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 10px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--muted)}
.sumbar{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.sumbar .kpi .v{font-size:1.35rem}
.approval{border-left:4px solid var(--ok);background:var(--ok-soft);padding:10px 14px;border-radius:var(--r)}
.approval.rej{border-left-color:var(--bad);background:var(--bad-soft)}
.note{background:var(--surface-2);border-radius:var(--r);padding:10px 14px;font-size:.9rem;color:var(--muted)}

/* ficha de clave */
.ficha-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.clave-big{font-family:var(--f-mono);font-size:1.8rem;font-weight:500;line-height:1}
.vigente-card{border:2px solid var(--ok);border-radius:var(--r);padding:14px;background:var(--surface)}
.vigente-card.none{border-color:var(--line-2);border-style:dashed}
.vigente-card .p{font-family:var(--f-display);font-size:2.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.spark{width:100%;height:120px;display:block}

/* login */
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .panel{padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}

/* modal y avisos */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,26,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:8px;box-shadow:var(--shadow);width:100%;max-width:640px;display:flex;flex-direction:column;max-height:88vh}
.modal.wide{max-width:1000px}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mb{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:var(--r);box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 32px))}
.toast.err{background:var(--bad);color:#fff}
.err-msg{color:var(--bad);font-size:.88rem}
.loading{color:var(--muted);padding:20px}
@media (max-width:1600px){ .who .rol{display:none} .nav button{padding-inline:9px} }
@media (max-width:640px){ .nav button{padding:10px 8px} .who .rol{display:none} h1{font-size:1.35rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Estilo Portal de Compras V2 ===== */
body{font-size:14px;line-height:1.45}
h1{font-size:19px;font-weight:700;color:var(--navy)} h2{font-size:15px;font-weight:700;color:var(--navy)} h3{font-size:14px;font-weight:700;color:var(--navy)}
.mono,.num{font-variant-numeric:tabular-nums;font-size:inherit;white-space:nowrap}
.eyebrow{letter-spacing:.04em;font-size:11px;color:var(--muted);font-weight:700}
.top{background:var(--navy);border-bottom:0;color:#fff}
.top-in{min-height:50px}
.brand{color:#fff;font-size:16px}
.nav button{color:rgba(255,255,255,.72);font-weight:600;font-size:13px;padding:15px 12px 12px;border-bottom:3px solid transparent}
.nav button:hover{color:#fff}
.nav button.on{color:#fff;border-bottom-color:#fff}
.who{color:#fff}.who .muted{color:rgba(255,255,255,.75)}
.who .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.who .btn.ghost:hover{border-color:#fff}
.panel{border-radius:12px;padding:16px 18px;border-color:var(--line)}
.kpi .v{font-size:24px;font-weight:700;color:var(--navy)}
.kpi .l{font-size:11.5px}
.btn{border:1.5px solid var(--line-2);color:var(--navy2);font-weight:700;font-size:13px;padding:7px 14px;border-radius:8px}
.btn:hover{border-color:var(--navy2)}
.btn.pri{background:var(--navy2);border-color:var(--navy2);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f0b4ad}
.btn.ghost{color:var(--navy2)}
.btn.sm{font-size:12px;padding:4px 10px}
input[type=text],input[type=number],input[type=password],input[type=search],input[type=date],select,textarea{border:1.5px solid var(--line-2);font-size:13px;padding:7px 10px}
.field label{font-size:12px;font-weight:600}
th{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:700;color:var(--navy);background:#f0f4ff}
th.num{font-family:var(--f-body);font-size:11.5px}
table{font-size:12.5px}
th,td{padding:6px 8px}
.tbl-wrap{border-radius:10px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.pill.EN.REVISION,.pill.rev{background:#e8eefc;color:var(--navy2)}
.tabs button{border:1.5px solid var(--line-2);color:var(--navy2);font-weight:600;font-size:12px}
.tabs button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.cmp-grid td input{font-size:12.5px}
.cmp-grid th.prov{background:#e8eefc;color:var(--navy)}
.cmp-grid th.key{background:var(--navy2)}
.chip{border-radius:8px}
.toast{background:#1a2035;color:#fff;border-radius:8px;font-size:13px}
.modal{border-radius:12px}
.modal header{background:var(--navy);color:#fff;border-radius:12px 12px 0 0}
.modal header h2,.modal header h3{color:#fff}
.modal header .btn.ghost{color:#fff}
.login .brand{color:var(--navy)}
.vigente-card .p,.clave-big{font-weight:700;color:var(--navy)}
/* Dentro del Portal de Compras V2: sin marca propia (la barra ya la da el portal) */
.embed .brand{display:none}
.embed main{padding-top:14px}
.embed .login{margin-top:4vh}
</style>
</head>

<script>
/* ====================================================================
   CAPA DE DATOS
   - Con SUPABASE_URL en config.js usa Supabase (datos compartidos).
   - Sin configuración arranca en MODO DEMOSTRACIÓN (datos de ejemplo
     guardados solo en este navegador).
   ==================================================================== */
const CFG = window.APP_CONFIG || {};
const DEMO = !CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY;

function netoDe(precio, descuentos, factor){
  if (precio === null || precio === undefined || precio === '' || isNaN(+precio)) return null;
  let n = +precio;
  String(descuentos || '').split(/[+,;\s]+/).forEach(d => { const x = parseFloat(d); if (!isNaN(x) && x) n *= (1 - x/100); });
  const f = parseFloat(factor); if (!isNaN(f) && f > 0) n *= f;
  return Math.round(n * 1e6) / 1e6;
}
function chunk(a, n){ const r=[]; for(let i=0;i<a.length;i+=n) r.push(a.slice(i,i+n)); return r; }
function errMsg(e){ return (e && (e.message || e.error_description || e.details)) || String(e); }

/* ---------------- SUPABASE ---------------- */
function makeSupabaseApi(){
  const sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  const ok = ({data, error}) => { if (error) throw new Error(error.message); return data; };
  const LIST_COLS = 'id,folio,titulo,comprador,estatus,claves,importe_actual,importe_propuesto,creado_por,creado_en,actualizado_por,actualizado_en,enviado_en,aprobado_por,aprobado_en,proveedores';
  async function all(q){ // paginación de 1000 en 1000
    let out=[], from=0;
    for(;;){ const d = ok(await q().range(from, from+999)); out = out.concat(d); if (d.length < 1000) break; from += 1000; }
    return out;
  }
  return {
    usuarios: async () => ok(await sb.from('cmp_usuarios').select('*').order('nombre')),
    verificarPin: async (id, pin) => ok(await sb.rpc('cmp_verificar_pin', {p_usuario_id:id, p_pin:pin})),
    usuariosConPin: async () => { const r = await sb.rpc('cmp_usuarios_con_pin'); if (r.error) return null; return (r.data || []).map(x => +(typeof x === 'object' ? Object.values(x)[0] : x)); },
    cambiarPin: async (id, actual, nuevo) => ok(await sb.rpc('cmp_cambiar_pin', {p_usuario_id:id, p_pin_actual:actual, p_pin_nuevo:nuevo})),
    registrarAcceso: async (u) => { await sb.from('cmp_accesos').insert({usuario:u.nombre, rol:u.rol, navegador:navigator.userAgent.slice(0,180)}); },
    accesos: async () => ok(await sb.from('cmp_accesos').select('*').order('fecha',{ascending:false}).limit(500)),
    bitacora: async () => ok(await sb.from('cmp_bitacora').select('*').order('fecha',{ascending:false}).limit(500)),
    log: async (usuario, accion, entidad, entidad_id, detalle) => { try{ await sb.from('cmp_bitacora').insert({usuario, accion, entidad, entidad_id:String(entidad_id??''), detalle}); }catch(e){} },
    buscarProductos: async (q) => {
      q = q.trim(); if (!q) return [];
      let qb = sb.from('cmp_productos').select('*').limit(60);
      if (/^\d+$/.test(q)) qb = qb.or(`clave.eq.${q},descripcion.ilike.%${q}%`);
      else q.split(/\s+/).filter(Boolean).forEach(w => { qb = qb.ilike('descripcion', `%${w.replace(/[%,()]/g,'')}%`); });
      return ok(await qb.order('clave'));
    },
    productos: async (claves) => { let out=[]; for (const c of chunk([...new Set(claves)], 200)) out = out.concat(ok(await sb.from('cmp_productos').select('*').in('clave', c))); return out; },
    vigentes: async (claves) => { let out=[]; for (const c of chunk([...new Set(claves)], 200)) out = out.concat(ok(await sb.from('cmp_asignaciones').select('*').eq('vigente',true).in('clave', c))); return out; },
    asignacionesVigentes: async () => all(() => sb.from('cmp_asignaciones').select('*').eq('vigente',true).order('clave')),
    ultimasAsignaciones: async (n=15) => ok(await sb.from('cmp_asignaciones').select('*').order('aprobado_en',{ascending:false}).limit(n)),
    contarVigentes: async () => { const r = await sb.from('cmp_asignaciones').select('id',{count:'exact',head:true}).eq('vigente',true); if (r.error) throw new Error(r.error.message); return r.count||0; },
    historialClave: async (clave) => ({
      asignaciones: ok(await sb.from('cmp_asignaciones').select('*').eq('clave', clave).order('aprobado_en',{ascending:false})),
      comparativos: ok(await sb.from('cmp_comparativos').select('*').contains('claves',[clave]).order('creado_en',{ascending:false}).limit(60)),
    }),
    proveedores: async () => ok(await sb.from('cmp_proveedores').select('*').order('nombre')),
    guardarProveedor: async (p, usuario) => {
      const row = {...p}; delete row.id; delete row.estatus; delete row.creado_en; delete row.actualizado_en; delete row.estatus_por; delete row.estatus_en; delete row.estatus_motivo;
      row.nombre = String(row.nombre||'').trim().toUpperCase();

/* ---------------- DEMOSTRACIÓN (localStorage) ---------------- */
function makeDemoApi(){
  const KEY = 'comparativos_demo_v7';
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
  if (!db) db = buildDemoSeed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {} };
  save();
  const now = () => new Date().toISOString();
  const nextId = (t) => { db.seq[t] = (db.seq[t]||0) + 1; return db.seq[t]; };
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const wait = (x) => new Promise(r => setTimeout(() => r(clone(x)), 60));
  function valida(uid, pin, roles){
    const u = db.usuarios.find(x => x.id === uid && x.activo);
    if (!u) throw new Error('Usuario no encontrado o inactivo');
    if (!roles.includes(u.rol)) throw new Error(`El usuario ${u.nombre} no tiene permiso para esta acción`);
    if (db.pins[uid] !== String(pin||'')) throw new Error('PIN incorrecto');
    return u;
  }
  const bloqueadoDemo = (prov, clave) => db.bloqueos.some(b => b.activo && b.proveedor_id === prov && (b.clave == null || b.clave === clave)) || (db.proveedores.find(p => p.id === prov)||{}).estatus === 'SUSPENDIDO';
  const bit = (usuario, accion, entidad, entidad_id, detalle) => db.bitacora.unshift({id:nextId('bitacora'), fecha:now(), usuario, accion, entidad, entidad_id:String(entidad_id??''), detalle});
  const clavesDe = (lineas) => [...new Set(lineas.map(l => +l.clave).filter(Boolean))];
  const LIST = c => { const x = {...c}; delete x.lineas; return x; };
  const histDemo = () => { const act = new Set(db.listas.filter(l => l.activa).map(l => l.id)); const L = new Map(db.listas.map(l => [l.id, l]));
    return db.precios.filter(p => act.has(p.lista_id)).map(p => ({...p, archivo:L.get(p.lista_id).archivo, periodicidad:L.get(p.lista_id).periodicidad, cargado_por:L.get(p.lista_id).cargado_por, cargado_en:L.get(p.lista_id).cargado_en})); };
  const vigentesDemo = () => { const m = new Map();
    histDemo().filter(p => p.clave != null).forEach(p => { const k = p.clave + '|' + p.proveedor_id, x = m.get(k);
      if (!x || p.vigencia_desde > x.vigencia_desde || (p.vigencia_desde === x.vigencia_desde && p.id > x.id)) m.set(k, p); });
    return [...m.values()]; };
  return {
    reset: () => { try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); },
    usuarios: async () => wait([...db.usuarios].sort((a,b)=>a.nombre.localeCompare(b.nombre))),
    verificarPin: async (id, pin) => { try { valida(id, pin, ['COMPRADOR','APROBADOR','ADMIN']); return wait(true); } catch(e) { return wait(false); } },
    usuariosConPin: async () => wait(Object.keys(db.pins).map(Number)),
    cambiarPin: async (id, actual, nuevo) => { const u = valida(id, actual, ['COMPRADOR','APROBADOR','ADMIN']); if (String(nuevo||'').length < 4) throw new Error('El PIN debe tener al menos 4 dígitos'); db.pins[id] = String(nuevo); bit(u.nombre,'CAMBIO DE PIN','usuario',id); save(); return wait(true); },
    registrarAcceso: async (u) => { db.accesos.unshift({id:nextId('accesos'), fecha:now(), usuario:u.nombre, rol:u.rol, navegador:navigator.userAgent.slice(0,180)}); save(); },
    accesos: async () => wait(db.accesos.slice(0,500)),
    bitacora: async () => wait(db.bitacora.slice(0,500)),
    log: async (usuario, accion, entidad, entidad_id, detalle) => { bit(usuario, accion, entidad, entidad_id, detalle); save(); },
    buscarProductos: async (q) => {
      q = q.trim().toUpperCase(); if (!q) return [];
      const words = q.split(/\s+/);
      return wait(db.productos.filter(p => (/^\d+$/.test(q) && String(p.clave) === q) || words.every(w => (p.descripcion||'').toUpperCase().includes(w))).slice(0,60));
    },
    productos: async (claves) => { const s = new Set(claves.map(Number)); return wait(db.productos.filter(p => s.has(p.clave))); },
    vigentes: async (claves) => { const s = new Set(claves.map(Number)); return wait(db.asignaciones.filter(a => a.vigente && s.has(a.clave))); },
    asignacionesVigentes: async () => wait(db.asignaciones.filter(a => a.vigente).sort((a,b)=>a.clave-b.clave)),
    ultimasAsignaciones: async (n=15) => wait([...db.asignaciones].sort((a,b)=>b.aprobado_en.localeCompare(a.aprobado_en)).slice(0,n)),
    contarVigentes: async () => db.asignaciones.filter(a => a.vigente).length,
    historialClave: async (clave) => wait({
      asignaciones: db.asignaciones.filter(a => a.clave === +clave).sort((a,b)=>b.aprobado_en.localeCompare(a.aprobado_en)),
      comparativos: db.comparativos.filter(c => c.claves.includes(+clave)).sort((a,b)=>b.creado_en.localeCompare(a.creado_en)),
    }),
    proveedores: async () => wait([...db.proveedores].sort((a,b)=>a.nombre.localeCompare(b.nombre))),
    guardarProveedor: async (p, usuario) => {
      const nombre = String(p.nombre||'').trim().toUpperCase();
      if (!nombre) throw new Error('Escribe el nombre del proveedor');
      if (db.proveedores.some(x => x.nombre === nombre && x.id !== p.id)) throw new Error(`Ya existe un proveedor llamado ${nombre}`);
      if (p.id_sistema != null && db.proveedores.some(x => x.id_sistema === p.id_sistema && x.id !== p.id)) throw new Error('Ya hay otro proveedor con ese ID del sistema');
      if (p.id){ const x = db.proveedores.find(x => x.id === p.id); const keep = {estatus:x.estatus, estatus_por:x.estatus_por, estatus_en:x.estatus_en, estatus_motivo:x.estatus_motivo, creado_por:x.creado_por, creado_en:x.creado_en};
        Object.assign(x, p, keep, {nombre, actualizado_por:usuario, actualizado_en:now()}); save(); return wait(x); }
      const x = {...p, id:nextId('proveedores'), nombre, estatus:'EN EVALUACION', creado_por:usuario, creado_en:now(), actualizado_por:usuario, actualizado_en:now()};
      db.proveedores.push(x); save(); return wait(x);
    },
    estatusProveedor: async (id, estatus, motivo, uid, pin) => { const u = valida(uid, pin, ['APROBADOR','ADMIN']); const p = db.proveedores.find(x => x.id === id);
      Object.assign(p, {estatus, estatus_por:u.nombre, estatus_en:now(), estatus_motivo:motivo, actualizado_por:u.nombre, actualizado_en:now()});
      bit(u.nombre, 'ESTATUS PROVEEDOR: '+estatus, 'proveedor', p.nombre, {motivo}); save(); return wait({ok:true}); },
    comparativos: async () => wait([...db.comparativos].sort((a,b)=>b.actualizado_en.localeCompare(a.actualizado_en)).map(LIST)),
    comparativo: async (id) => { const c = db.comparativos.find(x => x.id === +id); if (!c) throw new Error('Comparativo no encontrado'); return wait(c); },
    guardarComparativo: async (c, usuario) => {
      if (c.estatus === 'APROBADO') throw new Error('Un comparativo solo se aprueba con el PIN de un aprobador');
      const t = now();
      if (c.id){
        const x = db.comparativos.find(y => y.id === c.id);
        if (!x || !['BORRADOR','EN REVISION','RECHAZADO'].includes(x.estatus) || x.actualizado_en !== c.actualizado_en)
          throw new Error('Otra persona modificó este comparativo mientras lo editabas, o ya no se puede editar. Recárgalo para ver la versión actual.');
        Object.assign(x, {titulo:c.titulo, comprador:c.comprador, estatus:c.estatus, proveedores:c.proveedores, lineas:c.lineas, notas:c.notas,
          importe_actual:c.importe_actual, importe_propuesto:c.importe_propuesto, enviado_en:c.enviado_en||null, claves:clavesDe(c.lineas), actualizado_por:usuario, actualizado_en:t});
        save(); return wait(x);
      }
      const id = nextId('comparativos');
      const x = {id, folio:`CMP-${new Date().getFullYear()}-${String(nextId('folio')).padStart(4,'0')}`, titulo:c.titulo, comprador:c.comprador, estatus:c.estatus,
        proveedores:c.proveedores, lineas:c.lineas, claves:clavesDe(c.lineas), notas:c.notas, importe_actual:c.importe_actual, importe_propuesto:c.importe_propuesto,
        creado_por:usuario, creado_en:t, actualizado_por:usuario, actualizado_en:t, enviado_en:c.enviado_en||null, aprobado_por:null, aprobado_en:null, comentario_aprob:null};
      db.comparativos.push(x); save(); return wait(x);
    },
    aprobar: async (id, uid, pin, comentario) => {
      const u = valida(uid, pin, ['APROBADOR','ADMIN']);
      const c = db.comparativos.find(x => x.id === id);
      if (c.estatus !== 'EN REVISION') throw new Error(`Solo se aprueban comparativos EN REVISION (estatus actual: ${c.estatus})`);
      let n = 0; const t = now();
      for (const l of c.lineas){ // validación antes de cambiar nada
        if (l.elegido && ((l.precios||{})[l.elegido]||{}).neto != null && bloqueadoDemo(+l.elegido, +l.clave))
          throw new Error(`El proveedor ${(db.proveedores.find(p => p.id === +l.elegido)||{}).nombre} está bloqueado para la clave ${l.clave}`);
      }
      for (const l of c.lineas){
        if (!/^\d+$/.test(String(l.clave))) continue;
        Object.entries(l.precios||{}).forEach(([k, v]) => { if (v.neto == null || !db.proveedores.some(p => p.id === +k)) return;
          let r = db.relaciones.find(x => x.clave === +l.clave && x.proveedor_id === +k);
          if (!r) { r = {clave:+l.clave, proveedor_id:+k, tipo:'COTIZADO', fuente:'COMPARATIVO'}; db.relaciones.push(r); }
          if (r.tipo === 'SIMILAR') r.tipo = 'COTIZADO';
          Object.assign(r, {ultima_fecha:t.slice(0,10), ultimo_precio:v.neto, clave_proveedor:v.clave_prov || r.clave_proveedor || null, actualizado_en:t}); });
        if (!l.elegido) continue;
        const pr = (l.precios||{})[l.elegido]; const neto = pr && pr.neto;
        if (neto === null || neto === undefined || neto === '') continue;
        const prov = db.proveedores.find(p => p.id === +l.elegido);
        if (prov && prov.estatus === 'SUSPENDIDO') throw new Error(`El proveedor ${prov.nombre} está SUSPENDIDO (clave ${l.clave})`);
        const ant = db.asignaciones.find(a => a.clave === +l.clave && a.vigente);
        if (ant) ant.vigente = false;
        db.asignaciones.push({id:nextId('asignaciones'), clave:+l.clave, descripcion:l.descripcion, proveedor_id:prov?prov.id:null, proveedor:prov?prov.nombre:String(l.elegido),
          clave_proveedor:pr.clave_prov||null, precio:+neto, precio_anterior:ant?ant.precio:null, proveedor_anterior:ant?ant.proveedor:null, cantidad:l.cantidad,
          comparativo_id:c.id, folio:c.folio, comprador:c.comprador, aprobado_por:u.nombre, aprobado_en:t, vigente:true});
        n++;
      }
      Object.assign(c, {estatus:'APROBADO', aprobado_por:u.nombre, aprobado_en:t, comentario_aprob:comentario||null, actualizado_por:u.nombre, actualizado_en:t});
      bit(u.nombre, 'APROBÓ COMPARATIVO', 'comparativo', c.folio, {claves_asignadas:n, comentario, puesto:u.puesto});
      save(); return wait({ok:true, claves_asignadas:n, aprobado_por:u.nombre});
    },
    anular: async (id, uid, pin, motivo) => {
      const u = valida(uid, pin, ['APROBADOR','ADMIN']);
      if (!String(motivo||'').trim()) throw new Error('Escribe el motivo de la anulación');
      const c = db.comparativos.find(x => x.id === id);
      if (!c || c.estatus !== 'APROBADO') throw new Error(`Solo se anulan comparativos APROBADOS (estatus actual: ${c ? c.estatus : '—'})`);
      let rest = 0, sin = 0, cons = 0; const t = now();
      db.asignaciones.filter(a => a.comparativo_id === c.id && !a.anulada).forEach(a => {
        if (a.vigente) {
          Object.assign(a, {vigente:false, anulada:true, anulada_por:u.nombre, anulada_en:t});
          const prev = db.asignaciones.filter(x => x.clave === a.clave && x.id < a.id && !x.anulada).sort((x, y) => y.id - x.id)[0];
          if (prev) { prev.vigente = true; rest++; } else sin++;
        } else { Object.assign(a, {anulada:true, anulada_por:u.nombre, anulada_en:t}); cons++; }
      });
      Object.assign(c, {estatus:'ANULADO', anulado_por:u.nombre, anulado_en:t, motivo_anulacion:motivo, actualizado_por:u.nombre, actualizado_en:t});
      bit(u.nombre, 'ANULÓ APROBACIÓN', 'comparativo', c.folio, {motivo, claves_restauradas:rest, claves_sin_anterior:sin, claves_ya_reemplazadas:cons});
      save(); return wait({ok:true, restauradas:rest, sin_anterior:sin, conservadas:cons});
    },
    rechazar: async (id, uid, pin, comentario) => {
      const u = valida(uid, pin, ['APROBADOR','ADMIN']);
      const c = db.comparativos.find(x => x.id === id);
      if (c.estatus !== 'EN REVISION') throw new Error('Solo se rechazan comparativos EN REVISION');
      if (!String(comentario||'').trim()) throw new Error('Escribe el motivo del rechazo');
      Object.assign(c, {estatus:'RECHAZADO', aprobado_por:u.nombre, aprobado_en:now(), comentario_aprob:comentario, actualizado_por:u.nombre, actualizado_en:now()});
      bit(u.nombre, 'RECHAZÓ COMPARATIVO', 'comparativo', c.folio, {motivo:comentario}); save(); return wait({ok:true});
    },
    guardarUsuario: async (adminId, adminPin, u) => {
      const a = valida(adminId, adminPin, ['ADMIN']);
      const nombre = String(u.nombre||'').trim().toUpperCase();
      let x;
      if (u.id){ x = db.usuarios.find(y => y.id === u.id); Object.assign(x, {nombre, rol:u.rol, puesto:u.puesto||null, activo:u.activo!==false}); }
      else { if (db.usuarios.some(y => y.nombre === nombre)) throw new Error(`Ya existe el usuario ${nombre}`);
        x = {id:nextId('usuarios'), nombre, rol:u.rol, puesto:u.puesto||null, activo:u.activo!==false, creado_en:now()}; db.usuarios.push(x); }
      if (u.pin) db.pins[x.id] = String(u.pin);
      bit(a.nombre, 'GUARDÓ USUARIO', 'usuario', nombre, {rol:u.rol, activo:u.activo}); save(); return wait(x.id);
    },
    relaciones: async (claves) => { const k = new Set(claves.map(Number)); return wait(db.relaciones.filter(r => k.has(r.clave))); },
    relacionesProveedor: async (provId) => wait(db.relaciones.filter(r => r.proveedor_id === provId).sort((a,b) => a.clave - b.clave)),
    bloqueos: async () => wait(db.bloqueos.filter(b => b.activo)),
    /* listas de precios (demostración) */
    listasPrecio: async () => wait([...db.listas].sort((a,b) => b.cargado_en.localeCompare(a.cargado_en))),
    preciosDeLista: async (id) => wait(db.precios.filter(p => p.lista_id === id)),
    preciosVigentes: async (claves) => { const k = new Set(claves.map(Number)); return wait(vigentesDemo().filter(p => k.has(p.clave))); },

    if (r.collado != null) add(1, 7, r.collado, null, r.collado);

  });

}

/* modal: devuelve {el, close}. actions: [{label, cls, onClick(el) -> false para no cerrar}] */
function modal({title, body, actions=[], wide=false, onOpen}){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <header><h2>${esc(title)}</h2><span class="spacer"></span><button class="btn ghost sm" data-x aria-label="Cerrar">✕</button></header>
    <div class="mb">${body}</div>
    ${actions.length ? `<footer>${actions.map((a,i) => `<button class="btn ${a.cls||''}" data-a="${i}">${esc(a.label)}</button>`).join('')}</footer>` : ''}
  </div>`;
  const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  $('[data-x]', bg).onclick = close;
  $$('[data-a]', bg).forEach(b => b.onclick = async () => {
    const a = actions[+b.dataset.a]; if (!a.onClick) return close();
    b.disabled = true;
    try { const r = await a.onClick(bg); if (r !== false) close(); }
    catch(e) { const m = $('.err-msg', bg); if (m) m.textContent = errMsg(e); else toast(errMsg(e), true); }
    finally { b.disabled = false; }
  });
  document.body.appendChild(bg);
  const f = $('input,select,textarea', $('.mb', bg)); if (f) setTimeout(() => f.focus(), 30);
  onOpen && onOpen(bg);
  return {el:bg, close};
}
function confirmar(title, texto, label='Continuar', cls='pri'){

}

function sparkline(points){ // points: [{x:Date, y:number}]
  if (points.length < 2) return '';
  const W = 520, H = 120, P = {l:52, r:12, t:12, b:22};
  const xs = points.map(p => +p.x), ys = points.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) x1 = x0 + 864e5;
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const pad = (y1 - y0) * .15 || y1 * .1 || 1; y0 -= pad; y1 += pad;
  const X = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), Y = y => P.t + (1 - (y - y0) / (y1 - y0)) * (H - P.t - P.b);
  const d = points.map((p,i) => `${i ? 'L' : 'M'}${X(+p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = d + `L${X(xs[xs.length-1]).toFixed(1)},${H-P.b}L${X(xs[0]).toFixed(1)},${H-P.b}Z`;
  const last = points[points.length-1];
  const ticks = [y0 + (y1-y0)*.15, (y0+y1)/2, y1 - (y1-y0)*.15];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Historial de precio aprobado">
    ${ticks.map(t => `<line x1="${P.l}" x2="${W-P.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l-6}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${t.toFixed(2)}</text>`).join('')}
    <path d="${area}" fill="var(--accent-soft)" stroke="none"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${points.map(p => `<circle cx="${X(+p.x)}" cy="${Y(p.y)}" r="2.5" fill="var(--accent)"/>`).join('')}
    <circle cx="${X(+last.x)}" cy="${Y(last.y)}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>
    <text x="${P.l}" y="${H-6}" font-size="10" fill="var(--muted)">${esc(fmtF(points[0].x))}</text>
    <text x="${W-P.r}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(fmtF(last.x))}</text>
  </svg>`;
}

/* Tabla de proveedores con historial y bloqueos para una clave */
function tablaProvClave(clave, rels, bloqs){
  const ids = [...new Set([...rels.map(r => r.proveedor_id), ...bloqs.filter(b => b.clave != null && +b.clave === +clave).map(b => b.proveedor_id)])];
  if (!ids.length) return `<div class="tbl-wrap"><div class="empty">Sin proveedores registrados para esta clave. Se registran al cargar el archivo de proveedores por clave o al aprobar un comparativo.</div></div>`;
  const filas = ids.map(id => { const r = rels.find(x => x.proveedor_id === id) || {}; const pv = provPorId(id) || {nombre:'#' + id};
    const b = bloqs.find(x => x.proveedor_id === id && x.clave != null && +x.clave === +clave), g = bloqs.find(x => x.proveedor_id === id && x.clave == null);
    return {id, r, pv, b, g}; }).sort((a, b) => rangoTipo(a.r.tipo) - rangoTipo(b.r.tipo) || (b.r.importe || 0) - (a.r.importe || 0) || a.pv.nombre.localeCompare(b.pv.nombre));
  return `<div class="tbl-wrap"><table><thead><tr><th>Proveedor</th><th>Historial</th><th>Primera compra</th><th>Última vez</th><th class="num">Recepciones</th><th class="num">Importe</th><th class="num">Último precio</th><th>Clave proveedor</th><th>Estado</th>${isAprob() ? '<th></th>' : ''}</tr></thead><tbody>
    ${filas.map(({id, r, pv, b, g}) => `<tr><td><b>${esc(pv.nombre)}</b> ${pv.estatus && pv.estatus !== 'APROBADO' ? pill(pv.estatus) : ''}${pv.id_sistema ? `<div class="small muted mono">ID ${pv.id_sistema}</div>` : ''}</td>
      <td>${r.tipo ? `<span class="tag-rel ${claseTipo(r.tipo)}" title="${r.tipo === 'SIMILAR' ? 'Se le han comprado claves similares (misma marca, grupo y subgrupo)' : ''}">${etiquetaTipo(r.tipo, true)}</span>` : '<span class="muted small">—</span>'}</td>
      <td class="small">${fmtF(r.primera_fecha)}</td><td class="small">${fmtF(r.ultima_fecha)}</td><td class="num">${r.recepciones != null ? fmtN(r.recepciones) : '—'}</td><td class="num">${r.importe != null ? fmtImp(r.importe) : '—'}</td><td class="num">${fmt$(r.ultimo_precio)}</td><td class="mono small">${esc(r.clave_proveedor || '')}</td>
      <td class="small">${g ? `<span class="pill RECHAZADO">BLOQUEADO EN TODAS</span><div class="muted">${esc(g.motivo || '')}</div>` : b ? `<span class="pill RECHAZADO">BLOQUEADO</span><div class="muted">${esc(b.motivo || '')} · ${esc(b.bloqueado_por)}</div>` : pv.estatus === 'SUSPENDIDO' ? pill('SUSPENDIDO') : '<span class="pill APROBADO">SE COTIZA</span>'}</td>
      ${isAprob() ? `<td>${b ? `<button class="btn sm" data-desbloq="${b.id}">Desbloquear</button>` : g ? '' : `<button class="btn sm bad" data-bloqc="${id}" data-clave-b="${clave}">Bloquear</button>`}</td>` : ''}</tr>`).join('')}

    out.innerHTML = '<div class="loading">Buscando…</div>';
    const rs = await API.buscarProductos(txt);
    const exacta = rs.find(p => String(p.clave) === txt);

  };

}

const EDITABLE = ['BORRADOR', 'RECHAZADO'];
function nuevoComparativo(){
  return {id:null, folio:null, titulo:'', comprador:S.user.nombre, estatus:'BORRADOR', proveedores:[], lineas:[], notas:''};
}
async function vEditor(main, arg){
  let c;
  if (typeof arg === 'number') c = await API.comparativo(arg);
  else if (arg && arg.importado) c = arg.importado;
  else if (arg && arg.duplicar) c = arg.duplicar;
  else c = nuevoComparativo();
  S.editor = {c, prod:new Map(), vig:new Map(), rel:new Map()};
  await refrescarProveedores();
  try { S.editor.bloq = await API.bloqueos(); } catch(e) { S.editor.bloq = []; }
  const claves = c.lineas.map(l => +l.clave).filter(Boolean);
  if (claves.length) await cargarRefs(claves);
  if (arg && arg.nuevaClave) await agregarClaves([arg.nuevaClave], false);
  if (arg && arg.importado) { sugerirProveedores(claves); llenarConListas(); }
  // Comparativo creado desde una propuesta de compra autorizada (Portal de Compras V2): la primera vez que se abre
  // completa cada línea con el catálogo y el proveedor vigente (los proveedores y precios de lista se agregan abajo).
  const desdeProp = c.lineas.filter(l => l._completar);
  if (desdeProp.length && editable()) {
    desdeProp.forEach(l => { const p = E().prod.get(+l.clave) || {}, v = E().vig.get(+l.clave);
      Object.assign(l, {descripcion: l.descripcion || p.descripcion || '', u_costo: p.u_costo ?? null, u_compra: p.u_compra ?? null, f_u_compra: p.f_u_compra || null, base: p.precio_base ?? null,
        vigente: v ? {proveedor:v.proveedor, precio:v.precio, fecha:v.aprobado_en, folio:v.folio} : null, precios: l.precios || {}, elegido: null, manual: false, motivo: l.motivo || ''});
      delete l._completar; });
    S.dirty = true;
  }
  if (arg && (arg.importado || arg.duplicar || arg.nuevaClave)) S.dirty = true;
  // Borradores guardados (ej. creados desde una propuesta del Portal de Compras V2): agrega los
  // proveedores con historial y los precios de listas que les falten, igual que al capturar claves
  let avisoAuto = '';
  if (typeof arg === 'number' && editable() && claves.length) {
    const nuevos = sugerirProveedores(claves), llenos = llenarConListas();
    if (nuevos.length || llenos) { S.dirty = true;
      avisoAuto = `${llenos ? `${llenos} precio(s) tomados de las listas de precios. ` : ''}Presiona Guardar para que los cambios queden en el comparativo.`; }
  }
  c.lineas.forEach((l, i) => calcLinea(i));
  pintarEditor(main);
  if (avisoAuto) setTimeout(() => toast(avisoAuto), 100);

/* Congela encabezados (arriba) y columnas hasta "Último precio" (izquierda), como en Excel */
function congelar(){
  const t = $('#e-grid table.cmp-grid'); if (!t) return;
  const h1 = t.tHead.rows[0], h2 = t.tHead.rows[1];
  const nFz = [...h1.cells].findIndex(th => th.hasAttribute('data-ult')) + 1;
  // en pantallas angostas solo se congela la clave
  const n = window.innerWidth < 900 ? 1 : nFz;
  const lefts = []; let x = 0;
  [...h1.cells].slice(0, nFz).forEach((th, j) => { lefts[j] = x; x += th.getBoundingClientRect().width; });
  const marca = (cell, j) => { cell.classList.remove('fz', 'fz-last'); cell.style.left = '';
    if (j < n) { cell.classList.add('fz'); cell.style.left = lefts[j] + 'px'; if (j === n - 1) cell.classList.add('fz-last'); } };
  [...h1.cells].forEach((th, j) => { if (j < nFz) marca(th, j); });
  [...t.tBodies[0].rows].forEach(tr => [...tr.cells].forEach((td, j) => { if (j < nFz) marca(td, j); }));
  if (h2) { const top = h1.getBoundingClientRect().height; [...h2.cells].forEach(th => th.style.top = top + 'px'); }
}
window.addEventListener('resize', () => { if (S.view === 'editor') congelar(); });
/* Al moverse dentro de la tabla, la página se acomoda para que los encabezados no queden bajo la barra superior */
function alinearGrid(e){
  const g = $('#e-grid'), barra = $('.top'); if (!g || !barra) return;
  const limite = barra.getBoundingClientRect().bottom + 6, r = g.getBoundingClientRect();
  if (r.top >= limite - 1) return;
  if (e && e.type === 'wheel') {
    const alFinal = g.scrollTop + g.clientHeight >= g.scrollHeight - 2;
    if (e.deltaY > 0 && alFinal) return;   // ya terminó la tabla: deja seguir la página hacia abajo
  }
  window.scrollBy(0, r.top - limite);
}

async function agregarClaves(claves, repintar=true){
  const c = E().c; const ya = new Set(c.lineas.map(l => String(l.clave)));
  const nuevas = [...new Set(claves.map(String))].filter(k => !ya.has(k));
  const rep = claves.length - nuevas.length;
  if (!nuevas.length) { toast('Esas claves ya están en el comparativo'); return; }
  await cargarRefs(nuevas.map(Number));
  const sinCat = [];
  nuevas.forEach(k => {
    const p = E().prod.get(+k) || {}; const v = E().vig.get(+k);
    if (!p.clave) sinCat.push(k);
    c.lineas.push({clave:+k, descripcion:p.descripcion || '', cantidad:null, clasificacion:'', inversion:null, pron:null, antec:null,
      u_costo:p.u_costo ?? null, u_compra:p.u_compra ?? null, f_u_compra:p.f_u_compra || null, base:p.precio_base ?? null,
      vigente: v ? {proveedor:v.proveedor, precio:v.precio, fecha:v.aprobado_en, folio:v.folio} : null, precios:{}, elegido:null, manual:false, motivo:''});
    calcLinea(c.lineas.length - 1);
  });
  marcarCambio();
  const nuevosProv = sugerirProveedores(nuevas);
  if (nuevosProv.length) c.lineas.forEach((l, i) => calcLinea(i));
  const llenos = llenarConListas();
  if (llenos) setTimeout(() => toast(`${llenos} precio(s) tomados de las listas de precios`), 50);
  if (nuevosProv.length && repintar) pintarProvs();
  if (sinCat.length) toast(`No están en el catálogo: ${sinCat.join(', ')}. Revisa que la clave sea correcta.`, true);
  else if (rep) toast(`${rep} clave(s) ya estaban en el comparativo`);
  if (repintar) { pintarGrid(); pintarSum(); pintarAcciones(); }
}

/* Mismo acomodo que la "Comparativa de precios": ID … ÚLTIMO PRECIO | proveedor, DIF VS ULTM $, + % FLETE | COSTO MÍNIMO | DIF VS ULT. COSTO | PROVEEDOR */
function exportarComparativo(){
  const c = E().c, P = c.proveedores, dem = verDemanda();
  const head = ['ID','DESCRIPCION','CANTIDAD', ...(dem ? ['CLASIFICACION','INVERSIÓN','PRON','ANTEC','CRECIMIENTO'] : []), 'ULTIMO PRECIO'];
  const pctCols = new Set(); const monCols = new Set();
  if (dem) { pctCols.add(7); monCols.add(4); }
  monCols.add(head.length - 1);
  monCols.add(head.push('IMPORTE ULTIMO PRECIO') - 1);
  P.forEach(p => {
    if (p.con_clave) head.push(`${p.nombre} CLAVE`);
    head.push(p.nombre); monCols.add(head.length - 1);
    head.push('DIF VS ULTM $'); pctCols.add(head.length - 1);
    if (num(p.flete)) { head.push(`${p.nombre} + ${p.flete}% FLETE`); monCols.add(head.length - 1); }
  });
  const iMin = head.push('COSTO MINIMO') - 1; monCols.add(iMin);
  pctCols.add(head.push('DIF VS ULT. COSTO') - 1);
  head.push('PROVEEDOR');
  head.push('MEJOR PRECIO'); head.push('MOTIVO');
  monCols.add(head.push('IMPORTE ASIGNADO') - 1); monCols.add(head.push('IMPACTO $') - 1);
  const rows = c.lineas.map(l => { const pr = l.precios || {};
    const r = [l.clave, l.descripcion, l.cantidad, ...(dem ? [l.clasificacion || '', l.inversion ?? null, l.pron ?? null, l.antec ?? null, l._crec] : []), l.ultimo_precio ?? null, l._impUlt ?? null];
    P.forEach(p => { const x = pr[p.id] || {};
      if (p.con_clave) r.push(x.clave_prov || '');
      r.push(x.sinflete ?? x.precio ?? null); r.push((l._dif || {})[p.id] ?? null);
      if (num(p.flete)) r.push(x.neto ?? null); });
    const nom = (id) => (P.find(p => String(p.id) === String(id)) || {}).nombre || '';
    r.push(l._neto, l._vsUlt, l.elegido ? nom(l.elegido) : 'NO ASIGNAR', l._best ? nom(l._best) : '', l.motivo || '',
      l._neto != null && num(l.cantidad) != null ? l._neto * l.cantidad : null, l._impacto);
    return r; });
  const ent = new Array(head.length).fill(null); let col = 3 + (dem ? 5 : 0) + 2;
  P.forEach(p => { col += p.con_clave ? 1 : 0; ent[col] = p.entrega_tipo || ''; col += 2 + (num(p.flete) ? 1 : 0); });
  const t = totales();
  const info = [[`COMPARATIVO ${c.folio || '(sin guardar)'} · ${c.titulo}`], [`Comprador: ${c.comprador}`, null, `Estatus: ${c.estatus}`, null, c.aprobado_por ? `${c.estatus === 'APROBADO' ? 'Aprobado' : 'Revisado'} por ${c.aprobado_por} · ${fmtFH(c.aprobado_en)}` : null],
    [`Importe a último precio: ${fmtImp(t.act)}`, null, `Importe asignado: ${fmtImp(t.prop)}`, null, `% aumento ponderado: ${t.pctAum === null ? '—' : (t.pctAum*100).toFixed(2) + '%'}`], []];
  const aoa = [...info, head, ...rows, [], ent];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const r0 = info.length + 1;
  for (let r = r0; r < r0 + rows.length; r++) for (let j = 0; j < head.length; j++) {
    const cell = ws[XLSX.utils.encode_cell({r, c:j})]; if (!cell || cell.t !== 'n') continue;
    if (pctCols.has(j)) cell.z = '0.0%'; else if (monCols.has(j)) cell.z = '"$"#,##0.00';
  }
  ws['!cols'] = head.map((h, i) => ({wch: i === 1 ? 52 : Math.max(9, Math.min(22, String(h).length + 2))}));
  ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:info.length, c:0}, e:{r:info.length + rows.length, c:head.length - 1}})};
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'COMPARATIVO');
  descargarXlsx(wb, `${c.folio || 'comparativo'} ${c.titulo}`.replace(/[\\/:*?"<>|]/g, '').slice(0, 80) + '.xlsx');
}

/* ====================================================================
   LISTAS DE PRECIOS DE PROVEEDORES
   ==================================================================== */
const PERIODOS = [['SEMANAL',7],['QUINCENAL',15],['MENSUAL',31],['BIMESTRAL',62],['TRIMESTRAL',92],['SEMESTRAL',183],['ANUAL',366],['EVENTUAL',null]];
const diasPeriodo = (p) => { const x = PERIODOS.find(q => q[0] === p); return x ? x[1] : null; };
const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const sumaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);

/* Estado de actualización de un proveedor según su periodicidad */
function estadoLista(periodicidad, ultima){
  if (!ultima) return {cls:'EVAL', txt:'SIN LISTA', prox:null};
  const d = diasPeriodo(periodicidad); if (!d) return {cls:'', txt:'SIN PERIODICIDAD', prox:null};
  const prox = sumaDias(ultima, d), falta = diasEntre(hoyISO(), prox);
  if (falta < 0) return {cls:'RECHAZADO', txt:`VENCIDA HACE ${-falta} DÍA${falta === -1 ? '' : 'S'}`, prox};
  if (falta <= 7) return {cls:'rev', txt:falta === 0 ? 'VENCE HOY' : `VENCE EN ${falta} DÍA${falta === 1 ? '' : 'S'}`, prox};
  return {cls:'APROBADO', txt:'AL DÍA', prox};
}

const COLS_PLANTILLA = ['CLAVE MASFERRE','DESCRIPCIÓN MASFERRE','CLAVE PROVEEDOR','DESCRIPCIÓN PROVEEDOR','UNIDAD','PIEZAS POR EMPAQUE','PRECIO LISTA SIN IVA','DESCUENTOS (%)','PRECIO NETO SIN IVA','MÍNIMO DE COMPRA','TIEMPO DE ENTREGA (DÍAS)','VIGENCIA HASTA','OBSERVACIONES','ÚLTIMO PRECIO REGISTRADO'];
async function descargarPlantillaPrecios(p){
  let filas = [];
  if (p) {
    const [rels, vig] = await Promise.all([API.relacionesProveedor(p.id), API.preciosVigentesProveedor(p.id).catch(() => [])]);
    const claves = [...new Set([...rels.filter(r => r.tipo !== 'SIMILAR').map(r => r.clave), ...vig.map(v => v.clave)])].sort((a, b) => a - b);
    const prods = new Map((await API.productos(claves)).map(x => [+x.clave, x]));
    const vm = new Map(vig.map(v => [+v.clave, v])), rm = new Map(rels.map(r => [+r.clave, r]));
    filas = claves.map(k => { const pr = prods.get(+k) || {}, v = vm.get(+k) || {}, r = rm.get(+k) || {};
      return [k, pr.descripcion || '', v.clave_proveedor || r.clave_proveedor || '', v.descripcion || '', v.unidad || '', v.contenido ?? null, null, null, null, v.minimo_compra ?? null, v.tiempo_entrega ?? null, null, null, v.precio_neto ?? r.ultimo_precio ?? null]; });
  }

const CAMPOS_PRECIO = [['','Ignorar'],['proveedor','Proveedor (nombre) — varios proveedores'],['id_proveedor','ID del proveedor (sistema) — varios proveedores'],['fecha','Fecha del precio (ej. última compra)'],
  ['importe','Importe total (precio = importe ÷ cantidad)'],['cantidad','Cantidad (precio = importe ÷ cantidad)'],['clave','Clave Masferre (nuestra)'],['clave_proveedor','Clave del proveedor'],['descripcion','Descripción del proveedor'],['unidad','Unidad'],['contenido','Piezas por empaque'],
  ['precio_lista','Precio de lista'],['descuentos','Descuentos (%)'],['precio_neto','Precio neto'],['minimo_compra','Mínimo de compra'],['tiempo_entrega','Tiempo de entrega (días)'],['vigencia_hasta','Vigencia hasta'],['notas','Observaciones']];
function adivinaPrecio(h){
  const n = normH(h);
  if (!n || n.startsWith('ultimoprecio') || n === 'descripcionmasferre') return '';
  if (/masferre|sanver|nuestra|interna|clavemf/.test(n)) return 'clave';
  if (['idproveedor','idprov','numproveedor','noproveedor','cveproveedor'].includes(n)) return 'id_proveedor';
  if (n === 'proveedor' || n === 'nombreproveedor' || n.startsWith('razonsocial')) return 'proveedor';
  if (n.startsWith('importe') || n === 'total' || n === 'subtotal') return 'importe';
  if (n.startsWith('cantidad') || n === 'cant' || n === 'unidadesrecibidas') return 'cantidad';
  if (n.startsWith('ultimacompra') || n.startsWith('fecha')) return 'fecha';
  if (n === 'rank' || n.startsWith('primeracompra') || n.startsWith('partimporte') || n.includes('recepciones')) return '';
  if (n.includes('neto')) return 'precio_neto';
  if (n.startsWith('desc') && !n.startsWith('descrip')) return 'descuentos';
  if (n.startsWith('descrip')) return 'descripcion';
  if (n.includes('precio') || n.startsWith('costo') || n === 'pu' || n.includes('lista')) return 'precio_lista';
  if (/^(clave|codigo|sku|modelo|catalogo|noparte|numparte|parte|articulo|cve)/.test(n)) return 'clave_proveedor';
  if (n === 'um' || n.startsWith('unidad') || n.startsWith('umedida')) return 'unidad';
  if (/^(piezas|pzas|contenido|empaque|master|inner|caja)/.test(n)) return 'contenido';
  if (n.startsWith('minimo') || n === 'moq') return 'minimo_compra';
  if (n.includes('entrega') || n.startsWith('tiempo') || n.startsWith('dias')) return 'tiempo_entrega';
  if (n.includes('vigencia') || n.includes('valido')) return 'vigencia_hasta';
  if (/^(observ|nota|coment)/.test(n)) return 'notas';
  return '';
}

function filasDePrecios(data, cols, conIva){
  const col = (f) => cols.find(c => c.campo === f), val = (r, f) => col(f) ? (r || [])[col(f).j] : null;

    const clave = String(val(r, 'clave') ?? '').trim(), cp = val(r, 'clave_proveedor') == null ? '' : String(val(r, 'clave_proveedor')).trim();
    let lista = aNum(val(r, 'precio_lista')), neto = aNum(val(r, 'precio_neto'));
    if (lista == null && neto == null && col('importe') && col('cantidad')) { const im = aNum(val(r, 'importe')), ca = aNum(val(r, 'cantidad')); if (im != null && ca) lista = im / ca; }
    if ((!/^\d+$/.test(clave) && !cp) || (lista == null && neto == null)) return;
    let d = val(r, 'descuentos'), desc = null;
    if (d != null && d !== '') { if (typeof d === 'number') desc = String(d > 0 && d < 1 ? Math.round(d * 10000) / 100 : d); else desc = String(d).replace(/%/g, '').replace(/\s*,\s*/g, '+').trim(); if (desc === '0') desc = null; }
    if (lista != null) lista = lista / iva; if (neto != null) neto = neto / iva;
    if (neto == null) neto = netoDe(lista, desc, '');
    filas.push({clave:/^\d+$/.test(clave) ? clave : null, clave_proveedor:cp || null, descripcion:val(r, 'descripcion') ? String(val(r, 'descripcion')).trim() : null,
      unidad:val(r, 'unidad') ? String(val(r, 'unidad')).trim() : null, contenido:aNum(val(r, 'contenido')), precio_lista:r4(lista), descuentos:desc, precio_neto:r4(neto),
      minimo_compra:aNum(val(r, 'minimo_compra')), tiempo_entrega:aNum(val(r, 'tiempo_entrega')), vigencia_hasta:aFecha(val(r, 'vigencia_hasta')), notas:val(r, 'notas') ? String(val(r, 'notas')).trim() : null,

  });

}

function validarColsPrecio(cols){
  if (!cols.some(c => c.campo === 'clave') && !cols.some(c => c.campo === 'clave_proveedor')) throw new Error('Indica la columna de nuestra clave o la de la clave del proveedor');
  if (!cols.some(c => ['precio_lista','precio_neto'].includes(c.campo)) && !(cols.some(c => c.campo === 'importe') && cols.some(c => c.campo === 'cantidad'))) throw new Error('Indica la columna del precio (o la de importe y la de cantidad)');
  const usados = cols.filter(c => c.campo); if (new Set(usados.map(c => c.campo)).size !== usados.length) throw new Error('Hay dos columnas asignadas al mismo campo');

/* Si clave + proveedor se repiten (ej. varias compras), deja solo el precio con la fecha más reciente */
function soloRecientes(filas, activo){

}

/* ====================================================================
   IMPORTADOR DE EXCEL (comparativos y catálogo)
   ==================================================================== */
const normH = (h) => String(h ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9/]/g, '');
function leerExcel(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { try { res(XLSX.read(new Uint8Array(r.result), {type:'array', cellDates:true})); } catch(e) { rej(new Error('No se pudo leer el archivo. ¿Es un Excel (.xlsx / .xls / .csv)?')); } };
    r.onerror = () => rej(new Error('No se pudo leer el archivo'));
    r.readAsArrayBuffer(file);
  });
}
const aFecha = (v) => { if (!v) return null; if (v instanceof Date) return isNaN(v) ? null : v.toISOString().slice(0,10);
  const s = String(v).trim(); let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return null; };
const r2 = (v) => v === null ? null : Math.round(v * 100) / 100;
const aNum = (v) => { if (v === null || v === undefined || v === '') return null; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[$,\s]/g, '')); return isNaN(n) ? null : n; };

const ROLES_CMP = [['','Ignorar'],['clave','ID / Clave'],['descripcion','Descripción'],['cantidad','Cantidad'],['clasificacion','Clasificación'],['inversion','Inversión'],['pron','Pron'],['antec','Antec'],['ultimo_precio','Último precio'],['u_costo','U/costo'],['f_u_compra','F/U/compra (fecha)'],['u_compra','U/compra'],['base','Precio base'],['precio','Precio de proveedor →'],['clave_prov','Clave del proveedor →']];
function adivinaCmp(h, vals, vistos){
  const n = normH(h);
  if (!n) return {rol:''};
  if (['id','clave','sku','codigo','cve'].includes(n)) return {rol:'clave'};
  if (n.startsWith('descrip')) return {rol:'descripcion'};
  if (n.startsWith('cant')) return {rol:'cantidad'};
  if (n.startsWith('clasif')) return {rol:'clasificacion'};
  if (n.startsWith('inversi')) return {rol:'inversion'};
  if (n === 'pron' || n.startsWith('pronost')) return {rol:'pron'};
  if (n === 'antec' || n.startsWith('anteced')) return {rol:'antec'};
  if (n.startsWith('ultimoprecio') || n === 'ultprecio') return {rol:'ultimo_precio'};
  if (/flete|dif|crecim|minimo|asignad/.test(n)) return {rol:''};
  if (n.startsWith('f/u') || n.includes('fecha')) return {rol:'f_u_compra'};
  if (['u/costo','ucosto','ultimocosto','costo'].includes(n)) return {rol:'u_costo'};
  if (['u/compra','ucompra','ultimacompra'].includes(n)) return {rol:'u_compra'};
  if (['base','preciobase'].includes(n)) return {rol:'base'};
  if (/vs|mejor|margen|proveedor|total|importe|ahorro|diferencia/.test(n)) return {rol:''};
  const todos = vals.filter(v => v !== null && v !== '').map(aNum), nums = todos.filter(x => x !== null);
  if (!nums.length || nums.length < todos.length * 0.8) return {rol:''};  // admite notas al pie como "ENTREGA DIRECTA"
  const nombre = String(h).trim().toUpperCase();
  if (nums.every(x => Number.isInteger(x) && x >= 1000)) return {rol:'clave_prov', prov:nombre};
  return {rol:'precio', prov:nombre};
}

async function importarComparativo(){

    for (let j = 0; j < ncol; j++) {

        <div class="field"><label>Filas con clave</label><div style="padding-top:6px"><b>${data.filter(r => /^\d+$/.test(String((r||[])[ (cols.find(c => c.rol === 'clave')||{j:0}).j ] ?? '').trim())).length}</b> <span class="muted small">detectadas</span></div></div>
      </div>
      <datalist id="ix-dl">${provNames.map(n => `<option value="${esc(n)}">`).join('')}</datalist>

        <td><select data-r="${k}" style="width:190px">${ROLES_CMP.map(([v,l]) => `<option value="${v}" ${c.rol === v ? 'selected' : ''}>${l}</option>`).join('')}</select></td>
        <td><input data-pv="${k}" list="ix-dl" type="text" style="width:170px" value="${esc(c.prov || '')}" ${['precio','clave_prov'].includes(c.rol) ? '' : 'hidden'}></td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted" style="margin:0">Las columnas “+ 3% FLETE”, “DIF VS…”, “COSTO MÍNIMO” y “PROVEEDOR” se calculan solas: el % de flete se toma del encabezado y el tipo de entrega de la fila de notas al pie. Si un proveedor cotizó a precio de lista, impórtalo así y después captura sus descuentos en cascada tocando su nombre en el comparativo. Los proveedores que no existan se dan de alta “en evaluación”.</p>`;
    $$('[data-r]', el).forEach(s => s.onchange = () => { const k = +s.dataset.r; cols[k].rol = s.value; const i = $(`[data-pv="${k}"]`, el); i.hidden = !['precio','clave_prov'].includes(s.value); });
    $$('[data-pv]', el).forEach(i => i.oninput = () => { cols[+i.dataset.pv].prov = i.value.trim().toUpperCase(); });
  }
}
async function crearDesdeExcel(el){
  const imp = el._imp; if (!imp) throw new Error('Primero elige el archivo');
  const cols = imp.cols, colClave = cols.find(c => c.rol === 'clave');
  if (!colClave) throw new Error('Indica cuál columna es la Clave');
  const provCols = cols.filter(c => c.rol === 'precio');
  if (!provCols.length) throw new Error('Indica al menos una columna de precio de proveedor');
  if (provCols.some(c => !c.prov) || cols.some(c => c.rol === 'clave_prov' && !c.prov)) throw new Error('Escribe el nombre del proveedor en cada columna de precio o clave de proveedor');
  const titulo = $('#ix-t', el).value.trim(); if (!titulo) throw new Error('Escribe el título');
  // proveedores: existentes o nuevos
  const nombres = [...new Set(provCols.map(c => c.prov))];
  const faltan = nombres.filter(n => !S.proveedores.some(p => p.nombre === n));
  for (const n of faltan) { const p = await API.guardarProveedor({nombre:n}, S.user.nombre); API.log(S.user.nombre, 'ALTA PROVEEDOR', 'proveedor', p.nombre, {origen:'importación'}); }
  if (faltan.length) await refrescarProveedores();
  if (cols.filter(c => c.rol === 'clave').length > 1) throw new Error('Solo una columna puede ser el ID / Clave');
  // flete: encabezados tipo "TYMSA + 3% FLETE"
  const fletes = {};
  cols.forEach(c => { const m = String(c.h ?? '').match(/^(.+?)\s*\+\s*([\d.]+)\s*%\s*FLETE/i); if (m) fletes[m[1].trim().toUpperCase()] = m[2]; });
  // tipo de entrega: texto en filas sin clave bajo la columna del proveedor (ej. "ENTREGA DIRECTA")
  const entregas = {};
  imp.data.forEach(r => { if (/^\d+$/.test(String((r||[])[colClave.j] ?? '').trim())) return;
    provCols.forEach(c => { const v = (r||[])[c.j]; if (typeof v === 'string' && v.trim() && !entregas[c.prov]) entregas[c.prov] = v.trim().toUpperCase().replace('ENTTREGA', 'ENTREGA'); }); });
  const provs = nombres.map(n => { const p = S.proveedores.find(x => x.nombre === n); return {id:p.id, nombre:p.nombre, descuentos:'', factor:'', flete:fletes[n] || '', entrega_tipo:entregas[n] || '',
    entrega:p.tiempo_entrega || '', condiciones:p.condiciones_pago || '', con_clave:cols.some(c => c.rol === 'clave_prov' && c.prov === n)}; });
  const idDe = (n) => String(provs.find(p => p.nombre === n).id);
  const get = (r, rol) => { const c = cols.find(x => x.rol === rol); return c ? (r||[])[c.j] : null; };
  const lineas = []; const vistas = new Set();
  imp.data.forEach(r => {
    const k = String((r||[])[colClave.j] ?? '').trim(); if (!/^\d+$/.test(k) || vistas.has(k)) return; vistas.add(k);
    const precios = {};
    provCols.forEach(c => { const v = aNum((r||[])[c.j]); if (v !== null) { const id = idDe(c.prov); precios[id] = precios[id] || {}; precios[id].precio = v; } });
    cols.filter(c => c.rol === 'clave_prov').forEach(c => { const v = (r||[])[c.j]; if (v !== null && v !== '' && provs.some(p => p.nombre === c.prov)) { const id = idDe(c.prov); precios[id] = precios[id] || {}; precios[id].clave_prov = String(v); } });
    const up = aNum(get(r,'ultimo_precio'));
    lineas.push({clave:+k, descripcion:get(r,'descripcion') ? String(get(r,'descripcion')).trim() : '', cantidad:aNum(get(r,'cantidad')),
      clasificacion:get(r,'clasificacion') ? String(get(r,'clasificacion')).trim().toUpperCase() : '', inversion:r2(aNum(get(r,'inversion'))), pron:r2(aNum(get(r,'pron'))), antec:r2(aNum(get(r,'antec'))),
      ...(up !== null ? {ultimo_precio:up, ultimo_origen:'archivo'} : {}), u_costo:aNum(get(r,'u_costo')),
      u_compra:aNum(get(r,'u_compra')), f_u_compra:aFecha(get(r,'f_u_compra')), base:aNum(get(r,'base')), precios, elegido:null, manual:false, motivo:''});
  });
  if (!lineas.length) throw new Error('No encontré filas con clave numérica');
  // completa con el catálogo lo que no traiga el archivo
  const ps = await API.productos(lineas.map(l => l.clave)); const pm = new Map(ps.map(p => [+p.clave, p]));
  const vs = await API.vigentes(lineas.map(l => l.clave)); const vm = new Map(vs.map(v => [+v.clave, v]));
  lineas.forEach(l => { const p = pm.get(l.clave) || {}; const v = vm.get(l.clave);
    if (!l.descripcion) l.descripcion = p.descripcion || ''; if (l.u_costo === null) l.u_costo = p.u_costo ?? null; if (l.u_compra === null) l.u_compra = p.u_compra ?? null;
    if (!l.f_u_compra) l.f_u_compra = p.f_u_compra || null; if (l.base === null) l.base = p.precio_base ?? null;
    l.vigente = v ? {proveedor:v.proveedor, precio:v.precio, fecha:v.aprobado_en, folio:v.folio} : null; });
  const c = {...nuevoComparativo(), titulo, proveedores:provs, lineas, notas:`Importado de Excel (${el._nombre}).`};
  if (Object.keys(fletes).length || Object.keys(entregas).length) c.notas += ` Flete y tipo de entrega tomados del archivo.`;
  const comp = [...new Set(lineas.map(l => (pm.get(l.clave)||{}).comprador).filter(Boolean))];
  if (comp.length === 1 && S.usuarios.some(u => u.nombre === comp[0])) c.comprador = comp[0];
  setTimeout(() => { go('editor', {importado:c}).then(() => toast(`${lineas.length} claves importadas${faltan.length ? ` · proveedores nuevos: ${faltan.join(', ')}` : ''}. Revisa y guarda.`)); }, 0);
}

        const tipoTxt = col('tipo') ? String(r[col('tipo').j] ?? '') : '';
        const tipo = /cotiz/i.test(tipoTxt) ? 'COTIZADO' : /compra|comprad|entrada|factura|recep|orden|\boc\b/i.test(tipoTxt) ? 'COMPRADO' : tipoDef;
        brutas.push({clave, id_prov:idp, proveedor:prov, tipo, fecha:col('fecha') ? aFecha(r[col('fecha').j]) : null, precio:col('precio') ? aNum(r[col('precio').j]) : null,
          clave_prov:col('clave_prov') && r[col('clave_prov').j] != null ? String(r[col('clave_prov').j]).trim() : null});
      });
      const filas = consolidarRel(brutas);
      if (!filas.length) return toast('No encontré filas con clave numérica y proveedor', true);
      await subir(filas, $('#rx-r').checked, [...new Set(filas.map(f => +f.clave))], $('#rx-st'), $('#rx-go'));
    };
  }
}

async function admBloqueos(ab){
  await refrescarProveedores();
  const bloqs = await API.bloqueos();
  const nom = (id) => (provPorId(id) || {}).nombre || '#' + id;
  ab.innerHTML = `<div class="row" style="margin-bottom:10px"><span class="muted small">Un proveedor bloqueado no se agrega solo ni se puede asignar. Para todas las claves se bloquea desde Proveedores; para una clave, desde Consultar clave.</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Proveedor</th><th>Alcance</th><th>Motivo</th><th>Bloqueó</th>${isAprob() ? '<th></th>' : ''}</tr></thead><tbody>
    ${bloqs.map(b => `<tr><td><b>${esc(nom(b.proveedor_id))}</b></td><td>${b.clave == null ? '<span class="pill RECHAZADO">TODAS LAS CLAVES</span>' : `Clave <a href="#" class="mono" data-clave="${b.clave}">${b.clave}</a>`}</td>
      <td class="small">${esc(b.motivo || '')}</td><td class="small">${esc(b.bloqueado_por)}<div class="muted">${fmtF(b.bloqueado_en)}</div></td>
      ${isAprob() ? `<td><button class="btn sm" data-desbloq="${b.id}">Desbloquear</button></td>` : ''}</tr>`).join('') || `<tr><td colspan="5" class="empty">No hay proveedores bloqueados.</td></tr>`}
    </tbody></table></div>`;
  bindClaveLinks(ab); bindBloqueos(ab, () => admBloqueos(ab));
}
function admPin(ab){
  ab.innerHTML = `<form class="panel stack" id="pf" style="max-width:380px">
    <div class="field"><label for="p1">PIN actual</label><input id="p1" type="password" inputmode="numeric"></div>
    <div class="field"><label for="p2">PIN nuevo (mínimo 4 dígitos)</label><input id="p2" type="password" inputmode="numeric" autocomplete="new-password"></div>
    <div class="field"><label for="p3">Repite el PIN nuevo</label><input id="p3" type="password" inputmode="numeric" autocomplete="new-password"></div>
    <div class="err-msg" id="pe"></div><button class="btn pri">Cambiar PIN</button></form>`;
  $('#pf').onsubmit = async (e) => { e.preventDefault(); $('#pe').textContent = '';
    if ($('#p2').value !== $('#p3').value) { $('#pe').textContent = 'El PIN nuevo no coincide'; return; }
    try { await API.cambiarPin(S.user.id, $('#p1').value, $('#p2').value); toast('PIN actualizado'); $('#pf').reset(); } catch(err) { $('#pe').textContent = errMsg(err); } };
}

(async function boot(){
  const u = store.get('cmp_user');
  // Dentro del Portal de Compras V2: si cambió el usuario del portal, se vuelve a entrar
  const v2 = usuarioV2();
  if (u && v2 && store.get('cmp_v2') !== v2) { store.del('cmp_user'); return login(); }
  if (u) { try { const us = await API.usuarios(); const x = us.find(y => y.id === u.id && y.activo); if (x) { S.user = x; return start(); } } catch(e) {} }
  login();
})();
